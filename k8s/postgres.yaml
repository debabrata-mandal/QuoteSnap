# PostgreSQL for the API, reachable only inside the cluster as postgres:5432.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: quotesnap
            - name: POSTGRES_USER
              value: quotesnap
            # Applied only when the volume is first created; to change it later, use ALTER USER.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quotesnap
                  key: db-password
            # A subdirectory, so initdb doesn't fail on files the volume may already have (lost+found).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "quotesnap", "-d", "quotesnap"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "quotesnap", "-d", "quotesnap"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
